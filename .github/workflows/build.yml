name: Build Skyblock Multi

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: SkyblockMulti

      - name: Checkout Nexus Parties
        uses: actions/checkout@v4
        with:
          repository: Sceert/Nexus-Parties
          ref: b47d3a50bf680593a6f6aa982d0694688bac4f05
          path: Nexus Parties
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build Nexus Parties compile dependency
        working-directory: Nexus Parties
        run: gradle jar --stacktrace

      - name: Build Skyblock Multi
        working-directory: SkyblockMulti
        run: gradle build --stacktrace

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Skyblock Multi-build
          path: SkyblockMulti/build/libs/*.jar
          if-no-files-found: error
